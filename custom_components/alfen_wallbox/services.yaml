reboot_wallbox:
  description: Reboot alfen wallbox
  fields:
    entity_id:
      description: Name(s) of entities to change.
      example: "alfen_wallbox.garage"

set_current_limit:
  description: Set current charge limit
  fields:
    entity_id:
      description: Name(s) of entities to change.
      example: "number.wallbox_current_limit"
    limit:
      description: New limit.
      example: 16

enable_rfid_authorization_mode:
  description: Enables RFID auth mode
  fields:
    entity_id:
      description: Name(s) of entities to change.
      example: "select.wallbox_authorization_mode"

disable_rfid_authorization_mode:
  description: Disables RFID auth mode
  fields:
    entity_id:
      description: Name(s) of entities to change.
      example: "select.wallbox_authorization_mode"

set_current_phase:
  description: Set current phase mapping
  fields:
    entity_id:
      description: Name(s) of entities to change.
      example: "select.wallbox_active_load_balancing_phase_connection"
    phase:
      description: phase.
      example: "L1"

enable_phase_switching:
  description: Enable phase switching
  fields:
    entity_id:
      description: Name(s) of entities to change.
      example: "switch.wallbox_enable_phase_switching"

disable_phase_switching:
  description: Disable phase switching
  fields:
    entity_id:
      description: Name(s) of entities to change.
      example: "switch.wallbox_enable_phase_switching"

set_green_share:
  description: Set Green Share Percentage
  fields:
    entity_id:
      description: Name(s) of entities to change.
      example: "number.wallbox_solar_green_share"
    value:
      description: New value.
      example: 80

set_comfort_power:
  description: Set Solar Comfort Power
  fields:
    entity_id:
      description: Name(s) of entities to change.
      example: "number.wallbox_solar_comfort_level"
    value:
      description: New value.
      example: 1400

get_transactions:
  fields:
    start:
      required: false
      example: "2024-01-01 00:00:00"
      selector:
        datetime:
    end:
      required: false
      example: "2024-01-01 23:00:00"
      selector:
        datetime:

set_schedule_day:
  target:
    entity:
      integration: alfen_wallbox
      domain: switch
  fields:
    day:
      required: true
      example: "Monday"
      selector:
        select:
          options: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]
    timeslots:
      required: false
      example: '[{"start": "00:00", "end": "06:00", "max_power": 11}]'
      selector:
        object:

add_schedule_timeslot:
  target:
    entity:
      integration: alfen_wallbox
      domain: switch
  fields:
    start_time:
      required: true
      example: "22:00"
      selector:
        text:
    end_time:
      required: true
      example: "06:00"
      selector:
        text:
    days:
      required: false
      example: ["Monday", "Tuesday"]
      selector:
        select:
          multiple: true
          options: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]
    max_power:
      required: false
      example: 7.4
      selector:
        number:
          min: 1.4
          max: 22.1
          step: 0.1
          unit_of_measurement: kW
    max_current:
      required: false
      example: 16
      selector:
        number:
          min: 1
          max: 32
          unit_of_measurement: A
    replace:
      required: false
      default: false
      selector:
        boolean:

clear_charging_schedule:
  target:
    entity:
      integration: alfen_wallbox
      domain: switch
  fields:
    days:
      required: false
      example: ["Saturday", "Sunday"]
      selector:
        select:
          multiple: true
          options: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]
